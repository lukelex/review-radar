<text x="27" y="819" font-size="12" font-weight="400" fill="#555">DESIGN NOTE: Keep completion distinct from attention. This is a short-term history view, not an archive of notifications.</text>
<text x="27" y="840" font-size="10" font-weight="400" fill="#888">Illustrative data and counts. Grayscale only; labels carry meaning independently of color.</text>
