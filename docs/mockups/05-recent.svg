<text x="294" y="870" font-size="14" font-weight="600" fill="#333">Completion ends the outstanding action, not the story of the PR.</text>
<text x="294" y="901" font-size="12" font-weight="400" fill="#333">Review time and friction stop accumulating at completion.</text>
<text x="294" y="926" font-size="12" font-weight="400" fill="#333">Open detail to inspect the review journey and its evidence.</text>
<text x="294" y="951" font-size="12" font-weight="400" fill="#666">Old review requests and changes requested are history, not current actions.</text>
<text x="27" y="1070" font-size="12" font-weight="400" fill="#555">Merged and closed remain distinct. Historical friction does not reactivate a completed PR.</text>
<text x="27" y="1093" font-size="10" font-weight="400" fill="#777">Illustrative data. Friction levels and history are design targets, not computed metrics. Labels work without color.</text>
