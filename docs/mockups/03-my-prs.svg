<text x="27" y="1070" font-size="12" font-weight="400" fill="#555">Friction is independent of urgency: a waiting PR can rank above a PR needing action in this explicit alternate sort.</text>
<text x="27" y="1093" font-size="10" font-weight="400" fill="#777">Illustrative data. Friction levels and history are design targets, not computed metrics. Labels work without color.</text>
