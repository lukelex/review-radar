services:
  collector:
    container_name: collector
    image: review-radar-core:local
    build:
      context: .
      dockerfile: Dockerfile.core
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      - ./data:/data

  seed-export:
    container_name: seed-export
    image: review-radar-core:local
    build:
      context: .
      dockerfile: Dockerfile.core
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint:
      - "review-radar-seed-export"
    volumes:
      # SQLite WAL readers may need to create shared-memory sidecar files.
      - ./data:/data
      - ./tests/fixtures/github:/fixtures

  queue:
    container_name: queue
    image: review-radar-core:local
    build:
      context: .
      dockerfile: Dockerfile.core
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint:
      - "review-radar-queue"
    volumes:
      - ./data:/data

  state:
    container_name: state
    image: review-radar-core:local
    build:
      context: .
      dockerfile: Dockerfile.core
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint:
      - "review-radar-state"
    volumes:
      - ./data:/data

  desktop:
    container_name: desktop
    image: review-radar-desktop:local
    build:
      context: .
      dockerfile: Dockerfile.desktop
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    # Bound the shell and the helper processes it launches as one workload.
    cpus: "${REVIEW_RADAR_DESKTOP_CPUS:-2.0}"
    mem_limit: "${REVIEW_RADAR_DESKTOP_MEMORY:-1g}"
    pids_limit: "${REVIEW_RADAR_DESKTOP_PIDS:-256}"
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      REVIEW_RADAR_CAPTURE_DATABASE: /data/review-radar.sqlite3
      REVIEW_RADAR_STATE_DATABASE: /data/review-radar-state.sqlite3
      XDG_RUNTIME_DIR: /host-runtime
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      DISPLAY: ${DISPLAY:-}
      XAUTHORITY: /host-xauthority
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: ${QT_QPA_PLATFORM:-}
      QT_QUICK_BACKEND: ${QT_QUICK_BACKEND:-software}
    volumes:
      - ./data:/data
      - ${XDG_RUNTIME_DIR:-/tmp}:/host-runtime
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/host-xauthority:ro
