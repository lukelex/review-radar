query HydratePullRequests($ids: [ID!]!, $eventLimit: Int!) {
  nodes(ids: $ids) {
    ... on PullRequest {
      id number title url state isDraft createdAt updatedAt closedAt mergedAt
      author { login __typename }
      repository { nameWithOwner }
      reviewDecision mergeable mergeStateStatus
      reviews(last: $eventLimit) {
        pageInfo { hasPreviousPage }
        nodes { id author { login __typename } state submittedAt updatedAt }
      }
      timelineItems(last: $eventLimit, itemTypes: [READY_FOR_REVIEW_EVENT, CONVERT_TO_DRAFT_EVENT, CLOSED_EVENT, REOPENED_EVENT]) {
        pageInfo { hasPreviousPage }
        nodes {
          __typename
          ... on ReadyForReviewEvent { id createdAt }
          ... on ConvertToDraftEvent { id createdAt }
          ... on ClosedEvent { id createdAt }
          ... on ReopenedEvent { id createdAt }
        }
      }
      handoffItems: timelineItems(last: $eventLimit, itemTypes: [REVIEW_REQUESTED_EVENT, REVIEW_REQUEST_REMOVED_EVENT, HEAD_REF_FORCE_PUSHED_EVENT]) {
        pageInfo { hasPreviousPage }
        nodes {
          __typename
          ... on ReviewRequestedEvent {
            id createdAt
            requestedReviewer {
              __typename
              ... on User { login }
              ... on Team { slug }
              ... on Mannequin { login }
            }
          }
          ... on ReviewRequestRemovedEvent {
            id createdAt
            requestedReviewer {
              __typename
              ... on User { login }
              ... on Team { slug }
              ... on Mannequin { login }
            }
          }
          ... on HeadRefForcePushedEvent {
            id createdAt
            beforeCommit { oid }
            afterCommit { oid }
          }
        }
      }
      comments(last: $eventLimit) {
        pageInfo { hasPreviousPage }
        nodes { id author { login __typename } createdAt updatedAt }
      }
      reviewThreads(last: $eventLimit) {
        pageInfo { hasPreviousPage }
        nodes {
          comments(last: $eventLimit) {
            pageInfo { hasPreviousPage }
            nodes { id author { login __typename } createdAt updatedAt }
          }
        }
      }
      commits(last: $eventLimit) {
        pageInfo { hasPreviousPage }
        nodes {
          commit {
            oid committedDate additions deletions
            parents(first: 1) { nodes { oid } }
            statusCheckRollup {
              state
              contexts(first: 100) {
                totalCount
                pageInfo { hasNextPage }
              }
            }
          }
        }
      }
    }
  }
  rateLimit { cost remaining resetAt }
}
