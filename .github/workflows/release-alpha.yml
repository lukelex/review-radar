name: Release Linux alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0-alpha.1"
        required: true
        default: 0.1.0-alpha.1
        type: string
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Require successful CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for successful CI runs
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          workflows=(core.yml linux-qt.yml)
          deadline=$((SECONDS + 1800))

          while (( SECONDS < deadline )); do
            pending=0
            for workflow in "${workflows[@]}"; do
              runs=$(gh run list --workflow "$workflow" --commit "$COMMIT_SHA" --limit 20 \
                --json status,conclusion --jq '[.[] | {status, conclusion}]')
              if jq -e 'any(.[]; .conclusion == "success")' >/dev/null <<<"$runs"; then
                echo "$workflow: successful run found"
              elif jq -e 'any(.[]; .status == "completed" and .conclusion != "success")' >/dev/null <<<"$runs"; then
                echo "$workflow: CI failed for $COMMIT_SHA" >&2
                exit 1
              else
                echo "$workflow: waiting for a successful run"
                pending=1
              fi
            done
            (( pending == 0 )) && exit 0
            sleep 30
          done

          echo "Timed out waiting for successful CI runs for $COMMIT_SHA" >&2
          exit 1

  linux-alpha:
    name: Package Linux x86_64 alpha
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            version="${REF_NAME#v}"
          fi
          if [[ "$version" != *alpha* ]]; then
            echo "Release version must contain 'alpha': $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build and package native bundle
        run: ./scripts/package-release "${{ steps.version.outputs.version }}"

      - name: Verify packaged launcher
        run: |
          archive="build/review-radar-linux-x86_64-${{ steps.version.outputs.version }}.tar.gz"
          test -f "$archive"
          test -f "$archive.sha256"
          tar -tzf "$archive" | grep -E '/bin/review-radar$'
          tar -xzf "$archive" -C /tmp
          test -x "/tmp/review-radar-linux-x86_64-${{ steps.version.outputs.version }}/bin/review-radar"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            "build/review-radar-linux-x86_64-$VERSION.tar.gz" \
            "build/review-radar-linux-x86_64-$VERSION.tar.gz.sha256" \
            --title "Review Radar $VERSION" \
            --notes "Linux x86_64 alpha release. See the bundled README for requirements and launch instructions." \
            --prerelease \
            --target "$GITHUB_SHA"
