name: Linux Qt desktop CI

on:
  push:
    branches: [main]
    paths:
      - apps/linux-qt/**
      - docs/assets/logo.svg
      - Dockerfile
      - compose.yaml
      - .github/workflows/linux-qt.yml
  pull_request:
    paths:
      - apps/linux-qt/**
      - docs/assets/logo.svg
      - Dockerfile
      - compose.yaml
      - .github/workflows/linux-qt.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-qt-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          cmake g++ make qt6-base-dev qt6-declarative-dev qt6-qpa-plugins libqt6svg6
          qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts
          qml6-module-qtquick-templates qml6-module-qtqml-workerscript

      - name: Configure
        run: cmake -S apps/linux-qt -B build/linux-qt -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/linux-qt --parallel

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install QML lint dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-controls
          qml6-module-qtquick-layouts qml6-module-qtquick-templates

      - name: Lint QML
        run: /usr/lib/qt6/bin/qmllint apps/linux-qt/qml/*.qml

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt test dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          cmake g++ make qt6-base-dev qt6-declarative-dev qt6-qpa-plugins libqt6svg6
          qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts
          qml6-module-qtquick-templates qml6-module-qtqml-workerscript

      - name: Configure
        run: cmake -S apps/linux-qt -B build/linux-qt -DCMAKE_BUILD_TYPE=Release

      - name: Build test executable
        run: cmake --build build/linux-qt --parallel

      - name: Run tests
        run: ctest --test-dir build/linux-qt --output-on-failure
