name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          tags: review-radar-builder:ci
          load: true
          cache-from: type=gha,scope=review-radar-builder
          cache-to: type=gha,mode=max,scope=review-radar-builder

      - name: Check formatting
        run: docker run --rm review-radar-builder:ci cargo fmt --all -- --check

      - name: Run Clippy
        run: >-
          docker run --rm review-radar-builder:ci
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: docker run --rm review-radar-builder:ci cargo test --workspace --locked
