name: Core and Linux Qt CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - tests/**
      - Dockerfile
      - compose.yaml
      - .github/workflows/core.yml
      - apps/linux-qt/**
      - docs/assets/logo.svg
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - tests/**
      - Dockerfile
      - compose.yaml
      - .github/workflows/core.yml
      - apps/linux-qt/**
      - docs/assets/logo.svg
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILDER_IMAGE: ghcr.io/${{ github.repository }}/review-radar-builder:${{ github.sha }}

jobs:
  build:
    name: Build CI image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          tags: ${{ env.BUILDER_IMAGE }}
          cache-from: type=gha,scope=review-radar-builder
          cache-to: type=gha,mode=max,scope=review-radar-builder

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: docker run --rm "$BUILDER_IMAGE" cargo fmt --all -- --check

      - name: Run Clippy
        run: >-
          docker run --rm "$BUILDER_IMAGE"
          cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: docker run --rm "$BUILDER_IMAGE" cargo test --workspace --locked

      - name: Check fixture projections for every queue view
        run: >-
          docker run --rm "$BUILDER_IMAGE" cargo test -p review-radar-domain
          --lib fixture_projects_every_supported_queue_view --locked

  runtime-smoke:
    name: Smoke-test runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --target runtime --tag review-radar-runtime:ci .

      - name: Verify runtime binaries and startup
        run: >-
          docker run --rm --entrypoint sh review-radar-runtime:ci -ceu
          'test -x /usr/local/bin/review-radar-github &&
          test -x /usr/local/bin/review-radar-seed-export &&
          test -x /usr/local/bin/review-radar-queue &&
          test -x /usr/local/bin/review-radar-state &&
          review-radar-state --database /tmp/review-radar-state.sqlite3
          acknowledge --pull-request-id pr-smoke --fingerprint smoke'

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  core:
    name: Core track complete
    needs: [build, lint, test, runtime-smoke, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Core checks passed
        run: echo "Core track passed; starting the Linux Qt track."

  qt-build:
    name: Qt build
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          cmake g++ make qt6-base-dev qt6-declarative-dev qt6-qpa-plugins libqt6svg6
          qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls
          qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtqml-workerscript

      - name: Configure and build
        run: >-
          cmake -S apps/linux-qt -B build/linux-qt -DCMAKE_BUILD_TYPE=Release
          && cmake --build build/linux-qt --parallel

  qt-lint:
    name: Qt lint
    needs: qt-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install QML lint dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          qt6-declarative-dev qt6-declarative-dev-tools qml6-module-qtquick
          qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-layouts
          qml6-module-qtquick-templates qml6-module-qtqml-workerscript

      - name: Lint QML
        run: |
          set +e
          /usr/lib/qt6/bin/qmllint apps/linux-qt/qml/*.qml >qmllint.log 2>&1
          status=$?
          set -e
          cat qmllint.log
          if grep -qE '(^|: )Error:' qmllint.log; then
            exit 1
          fi
          # Ubuntu's Qt 6.4 qmllint reports generated-module diagnostics as
          # warnings; syntax and type errors remain fatal above.
          exit 0

  qt-test:
    name: Qt tests
    needs: qt-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt test dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          cmake g++ make qt6-base-dev qt6-declarative-dev qt6-qpa-plugins libqt6svg6
          qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls
          qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtqml-workerscript

      - name: Configure and build test executable
        run: >-
          cmake -S apps/linux-qt -B build/linux-qt -DCMAKE_BUILD_TYPE=Release
          && cmake --build build/linux-qt --parallel

      - name: Run Qt tests
        run: ctest --test-dir build/linux-qt --output-on-failure

  coverage:
    name: Coverage (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate LCOV report
        run: cargo llvm-cov --workspace --locked --lcov --output-path coverage/lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  cleanup:
    name: Clean up CI image
    if: ${{ always() }}
    needs: [build, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Delete temporary GHCR image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          package_name="${GITHUB_REPOSITORY#*/}/review-radar-builder"
          package_path="${package_name//\//%2F}"
          version_id="$(gh api --paginate \
            "/user/packages/container/$package_path/versions?per_page=100" \
            --jq '.[] | select(.metadata.container.tags[]? == "'"$IMAGE_TAG"'") | .id' \
            | head -n 1)" || {
              echo "Temporary GHCR package was not available for cleanup; continuing."
              exit 0
            }

          if [ -n "$version_id" ]; then
            gh api --method DELETE \
              "/user/packages/container/$package_path/versions/$version_id"
          fi
