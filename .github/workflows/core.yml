name: Core CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - tests/**
      - Dockerfile
      - compose.yaml
      - .github/workflows/core.yml

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILDER_IMAGE: ghcr.io/${{ github.repository }}/review-radar-builder:${{ github.sha }}

jobs:
  build:
    name: Build CI image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          tags: ${{ env.BUILDER_IMAGE }}
          cache-from: type=gha,scope=review-radar-builder
          cache-to: type=gha,mode=max,scope=review-radar-builder

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: docker run --rm "$BUILDER_IMAGE" cargo fmt --all -- --check

      - name: Run Clippy
        run: >-
          docker run --rm "$BUILDER_IMAGE"
          cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: docker run --rm "$BUILDER_IMAGE" cargo test --workspace --locked

  cleanup:
    name: Clean up CI image
    if: ${{ always() }}
    needs: [build, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Delete temporary GHCR image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          version_id="$(gh api --paginate \
            "/user/packages/container/review-radar-builder/versions?per_page=100" \
            --jq '.[] | select(.metadata.container.tags[]? == "'"$IMAGE_TAG"'") | .id' \
            | head -n 1)"

          if [ -n "$version_id" ]; then
            gh api --method DELETE \
              "/user/packages/container/review-radar-builder/versions/$version_id"
          fi
